<div class="container-click animate-fade-in">
  <!-- ======================= PROFILE CARD ======================= -->
  @if (profile()) {

  <div class="profile-card">
    <ui-profile
      [profile]="profile()!"
      [postsCount]="postsCount()"
      [lastPosts]="lastPosts()"
      (edit)="editProfile()"
    />
  </div>

  <div class="divider"></div>

  <!-- ======================= PUBLICACIONES ======================= -->
  <h3 class="section-title">Todas tus publicaciones</h3>

  @if (loadingPosts()) {
  <div class="flex justify-center py-10 text-gray-500">
    <ui-spinner size="lg" label="Cargando publicaciones..." />
  </div>

  } @else if (allPosts().length === 0) {

  <p class="no-posts">Todavía no tenés publicaciones.</p>

  } @else {

  <div class="posts-grid">
    @for (post of allPosts(); track post._id) {
    <div class="grid-item" (click)="openPost(post)">
      <img [src]="post.imagenUrl" class="grid-image" alt="Publicación" loading="lazy" />
    </div>
    }
  </div>
  } }
</div>
