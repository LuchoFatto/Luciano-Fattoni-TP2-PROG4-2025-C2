<ul class="text-xs mt-2 space-y-1" aria-live="polite">
  <li
    class="flex items-center gap-2"
    [class.text-green-600]="checks().lengthOk"
    [class.text-gray-500]="!checks().lengthOk"
  >
    <span>• Mínimo 8 caracteres</span>
  </li>

  <li
    class="flex items-center gap-2"
    [class.text-green-600]="checks().upperOk"
    [class.text-gray-500]="!checks().upperOk"
  >
    <span>• Al menos una mayúscula</span>
  </li>

  <li
    class="flex items-center gap-2"
    [class.text-green-600]="checks().numberOk"
    [class.text-gray-500]="!checks().numberOk"
  >
    <span>• Al menos un número</span>
  </li>

  <li
    class="flex items-center gap-2"
    [class.text-green-600]="checks().symbolOk"
    [class.text-gray-500]="!checks().symbolOk"
  >
    <span>• Al menos un símbolo</span>
  </li>
</ul>
