<!-- Fondo oscuro -->
<div class="overlay" (click)="closeModal()"></div>

<!-- Modal -->
<div class="modal animate-pop">
  <!-- Botón cerrar -->
  <button class="btn-close" (click)="closeModal()">×</button>

  <!-- Imagen -->
  <img [src]="post.imagenUrl" class="modal-image" alt="post" />

  <!-- Información -->
  <div class="info">
    <div class="header">
      <img
        [src]="post.autor.imagenPerfil || 'https://cdn-icons-png.flaticon.com/512/9131/9131529.png'"
        class="avatar"
      />

      <div class="user">
        <h3>{{ post.autor.nombreUsuario }}</h3>
        <span class="date">{{ post.createdAt | date : 'mediumDate' }}</span>
      </div>

      @if (post.isMine) {
      <button class="btn-delete" (click)="onDelete()">Eliminar</button>
      }
    </div>

    <!-- Like row -->
    <div class="likes-row">
      <button class="btn-like" (click)="toggleLike()">
        @if (!post.likedByMe) {
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M4.318 6.318a4.5 4.5 0 0 1 6.364 0L12 7.636l1.318-1.318a4.5
                4.5 0 1 1 6.364 6.364L12 20.364l-7.682-7.682a4.5
                4.5 0 0 1 0-6.364z"
          />
        </svg>
        } @else {
        <svg class="icon liked" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5
                2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5
                2.09C13.09 3.81 14.76 3 16.5 3 19.58 3
                22 5.42 22 8.5c0 3.78-3.4 6.86-8.55
                11.54L12 21.35z"
          />
        </svg>
        }
      </button>

      <span class="likes-count">{{ post.likesCount }} me gusta</span>
    </div>

    <!-- ===== TÍTULO ===== -->
    @if (post.titulo) {
    <h2 class="modal-title">{{ post.titulo }}</h2>
    }

    <!-- Descripción -->
    <p class="description">{{ post.descripcion }}</p>
  </div>
</div>
