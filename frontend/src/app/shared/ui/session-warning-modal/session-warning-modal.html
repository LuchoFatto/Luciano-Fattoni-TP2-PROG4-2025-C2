<!-- Overlay oscuro -->
<div class="modal-overlay">
  <div class="modal-container">
    <!-- Ícono de advertencia -->
    <div class="icon-container">
      <svg class="warning-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
        />
      </svg>
    </div>

    <!-- Título -->
    <h2 class="modal-title">Tu sesión está por expirar</h2>

    <!-- Mensaje -->
    <p class="modal-message">
      Tu sesión expirará en
      <strong class="time-remaining">{{ timeRemaining }}</strong>
    </p>

    <p class="modal-submessage">¿Deseas extender tu sesión?</p>

    <!-- Botones -->
    <div class="button-group">
      <button (click)="onExtend()" class="btn btn-primary">Extender sesión</button>
      <button (click)="onLogout()" class="btn btn-secondary">Cerrar sesión</button>
    </div>
  </div>
</div>
