<ui-navbar
  [appName]="'Click'"
  [username]="username()"
  [avatarUrl]="avatarUrl()"
  [links]="navLinks()"
  [dropdownItems]="navDropdown()"
  (dropdownClicked)="onDropdownClick($event)"
  (linkClicked)="onNavLinkClick($event)"
  (logoClicked)="goHome()"
></ui-navbar>

<ui-loading-overlay />
<router-outlet />

<!-- Modal de advertencia de sesión -->
@if (showSessionWarning()) {
<ui-session-warning-modal
  [timeRemaining]="formattedTime()"
  (extend)="onExtendSession()"
  (logout)="onLogoutFromModal()"
/>
}
